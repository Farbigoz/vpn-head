---
# Установка 3x-ui зафиксированной версии на VPN-ноду.
# Панель доступна только дирижёру (ограничение UFW — в роли common).
# Учётные данные панели и подключение к master — на этапе 02-join-node.

- name: Проверить, не установлена ли уже нужная версия 3x-ui
  ansible.builtin.command: /usr/local/x-ui/x-ui setting -show true
  register: xui_setting_check
  changed_when: false
  failed_when: false

- name: Скачать установочный скрипт 3x-ui
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/MHSanaei/3x-ui/master/install.sh
    dest: /tmp/xui-install.sh
    mode: "0755"

- name: Установить 3x-ui версии {{ xui_version }}
  # Скрипт задаёт интерактивный вопрос про настройку порта — отвечаем "n":
  # порт и путь панели выставим дальше через x-ui setting.
  ansible.builtin.shell: printf 'n\n' | bash /tmp/xui-install.sh "v{{ xui_version }}"
  args:
    creates: /usr/local/x-ui/x-ui

- name: Зафиксировать порт и секретный путь панели
  ansible.builtin.command: >-
    /usr/local/x-ui/x-ui setting -port {{ xui_panel_port }}
    -webBasePath {{ xui_panel_path }}/
  register: xui_setting
  changed_when: "'Succeeded' in xui_setting.stdout or xui_setting.rc == 0"

- name: Перезапустить x-ui для применения настроек панели
  ansible.builtin.service:
    name: x-ui
    state: restarted
    enabled: true

- name: Убедиться, что сервис x-ui активен
  ansible.builtin.service_facts:

- name: Проверить состояние x-ui
  ansible.builtin.assert:
    that:
      - ansible_facts.services['x-ui.service'] is defined
      - ansible_facts.services['x-ui.service'].state == 'running'
    fail_msg: "Сервис x-ui не запущен — смотрите 'journalctl -u x-ui' на ноде"

- name: Удалить установочный скрипт
  ansible.builtin.file:
    path: /tmp/xui-install.sh
    state: absent
