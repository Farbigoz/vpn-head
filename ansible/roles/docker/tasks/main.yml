---
# Docker + compose plugin на дирижёре (для Semaphore и Uptime Kuma).
# VERIFY: пакетные имена проверяются под Debian 13/12 и Ubuntu 22.04+;
# на других дистрибутивах скорректируйте список.

- name: Установить Docker и compose-плагин
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-v2
    state: present
    update_cache: true

- name: Запустить и включить Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
