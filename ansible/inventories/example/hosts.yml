---
# Шаблонный инвентарь. Реальные адреса замените в своей копии
# (scripts/new-deployment.sh создаёт копию автоматически).
# Секретов здесь быть не должно — они живут в group_vars/all/vault.yml.

all:
  children:
    # Дирижёр: 3x-ui master, Semaphore (Web UI), Uptime Kuma, acme.sh.
    # Разворачивается на отдельном VPS (рекомендуется) или в homelab.
    # Не участвует в пропуске VPN-трафика.
    conductor:
      hosts:
        conductor01:
          ansible_host: 198.51.100.10     # IP дирижёра (VPS или homelab)
          ansible_user: root
          conductor_ip: 198.51.100.10     # для UFW на нодах (доступ к панелям)

    # VPN-ноды описываются ПО ОДНОМУ ФАЙЛУ на ноду прямо в этом каталоге
    # (n1.yml, n2.yml, …) — Ansible НЕ читает подкаталоги инвентаря.
    # Добавить новую: скопируйте файл или запустите плейбук 00-add-node
    # (в Web UI Semaphore — шаблон «Добавить ноду»).
    vpn_nodes:
      hosts: {}
