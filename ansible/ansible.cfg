[defaults]
# По умолчанию — шаблонный инвентарь (каталог: hosts.yml + group_vars/ + nodes.d/).
# Для реальной работы:
#   ansible-playbook -i inventories/<имя> ...
# или задайте inventory в ansible.cfg своей копии.
inventory = inventories/example
roles_path = roles
retry_files_enabled = False
interpreter_python = auto_silent
forks = 10
timeout = 30

[privilege_escalation]
become = True
become_method = sudo
